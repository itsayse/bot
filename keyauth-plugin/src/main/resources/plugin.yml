name: KeyAuth
version: '1.0.0'
main: dev.observer.keyauth.KeyAuthPlugin
api-version: '1.21'
author: YourName
description: Key-gated registration/login for Minecraft — verifies keys against the Discord bot's key API. One key per player, kicks on expiry/revocation.

commands:
  key:
    description: Redeem your access key and link your Discord account
    usage: /key <code> <discordUserId>
  register:
    description: Set your password after redeeming a key
    usage: /register <password> <confirmPassword>
  login:
    description: Log in with your password
    usage: /login <password>
  changeuser:
    description: Re-link your account to a different Discord user id
    usage: /changeuser <newDiscordUserId>
