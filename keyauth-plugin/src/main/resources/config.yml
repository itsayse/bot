api:
  # Must point at the Discord bot's key API (utils/mc_api.py). Same machine -> localhost works.
  base-url: "http://127.0.0.1:8787"
  # Must exactly match MC_API_SECRET in the bot's .env
  secret: "change-this-to-match-your-bot-env"

auth:
  max-login-attempts: 5
  # How often (in minutes) online, already-authenticated players get re-checked
  # against the bot in case their key expired or was revoked mid-session.
  key-check-interval-minutes: 5

messages:
  need-key: "&eWelcome! Enter your access key and your Discord user ID: &7/key <code> <discordUserId>"
  need-register: "&aKey accepted! Now set a password: &7/register <password> <confirm>"
  need-login: "&eWelcome back! Please log in: &7/login <password>"
  not-now: "&cThat command isn't usable right now."
  still-locked: "&cYou need to log in before doing that."
  login-success: "&aLogged in successfully!"
  wrong-password: "&cWrong password. Attempts left: %attempts%"
  too-many-attempts: "&cToo many failed login attempts."
  key-invalid: "&cThat key is invalid."
  key-expired: "&cThat key has expired. Ask staff for a new one."
  key-revoked: "&cThat key has been revoked."
  key-used: "&cThat key has already been claimed by another account."
  key-check-failed-expired: "&cYour access key has expired."
  key-check-failed-revoked: "&cYour access key was revoked."
  api-unreachable: "&cCouldn't reach the verification server — try again in a moment."
  discord-id-invalid: "&cThat doesn't look like a valid Discord user ID (15-20 digits). Enable Developer Mode in Discord, right-click your profile, then Copy User ID."
  changeuser-success: "&aYour linked Discord account was updated — your server role has been moved over."
  changeuser-failed: "&cCouldn't update your linked Discord account. Try again in a moment."
