name: Build KeyAuth plugin

on:
  push:
    paths:
      - 'keyauth-plugin/**'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        working-directory: keyauth-plugin
        run: mvn -B clean package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: keyauth-jar
          path: keyauth-plugin/target/keyauth.jar
