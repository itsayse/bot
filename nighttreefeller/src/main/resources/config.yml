sleep:
  # Number of sleeping players required to trigger the night skip.
  # With the default of 1, a single player sleeping is enough, no matter how many players are online.
  players-required: 1

  # If true, "players-required" is treated as a percentage (1-100) of players
  # currently in the world instead of a fixed head-count.
  use-percentage: false

  # How long (in seconds) the smooth transition from night to day should take.
  # Higher = slower/smoother sunrise, lower = faster.
  transition-seconds: 6

  # Clear any active thunderstorm as part of the transition.
  clear-storm: true

  # Message broadcast to the world when the transition starts. Use '' to disable.
  start-message: "&e☀ &7The night fades away as everyone drifts off to sleep..."

tree-feller:
  enabled: true

  # Require the player to be holding an axe for a chop to fell the whole tree.
  # If false, breaking the base log with any tool/hand will fell the tree.
  require-axe: true

  # Require the player to be SNEAKING (holding shift) while chopping for
  # felling/leaf-decay to trigger at all. This is the main safeguard against
  # accidentally destroying player builds: normal building and demolition
  # doesn't involve crouching, so with this on, felling and leaf decay only
  # ever activate when a player deliberately crouches to chop a tree down.
  # Strongly recommended to leave this on.
  require-sneak: true

  # Safety cap on how many connected log blocks can be felled in one go.
  # Prevents huge builds made of logs from being destroyed if this ever misfires.
  max-logs: 200

  # Whether felled logs drop as items on the ground.
  drop-items: true

  # Play a wood-breaking sound effect when a tree is felled.
  play-sound: true

  leaf-decay:
    # Make the felled tree's leaf canopy decay quickly instead of floating there.
    enabled: true

    # Safety cap on how many leaf blocks can be decayed at once.
    max-leaves: 300

    # How long (in seconds) the leaves take to fully decay away. They vanish
    # gradually within this window (staggered), not all at once.
    decay-seconds: 1.5

    # Chance (0.0 - 1.0) that any single decaying leaf block drops a sapling,
    # same as vanilla natural leaf decay.
    sapling-drop-chance: 0.05

    # How many block-hops (through touching log/leaf blocks only, matching
    # vanilla's own leaf-support rule) to search for a surviving log before
    # treating a leaf as "orphaned" and eligible to decay. A nearby but
    # disconnected tree does NOT count as support - only leaves/logs the
    # canopy actually touches do, so standing trees are never affected but
    # a felled tree's own leaves aren't falsely "protected" by a neighbour.
    support-radius: 6

announcements:
  tellraw:
    enabled: true

    # How often (in minutes) the next message in the list is posted.
    interval-minutes: 20

    # How long to wait after the server starts before the first announcement.
    # Defaults to the same value as interval-minutes if not set.
    initial-delay-minutes: 20

    # A list of raw JSON text components. One is sent every interval-minutes,
    # in order, via: tellraw @a <message>. After the last one it loops back to
    # the first. Edit/add/remove entries here - each one must stay valid JSON.
    messages:
      - '{"text":"Daily Server Restart — Every day at 12:00 AM","color":"yellow"}'
      - '{"text":"Found a Bug? Report it through a ticket in Discord.","color":"red"}'
      - '{"text":"Tree Timber Tip — Hold SHIFT while mining logs to avoid activating Timber.","color":"green"}'
      - '{"text":"Random Minecraft Tip — Keep your valuables in a safe chest before exploring!","color":"aqua"}'
