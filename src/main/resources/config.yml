# PerfectTeams configuration

storage:
  # File name is stored inside the plugin's data folder (plugins/PerfectTeams/).
  database-file: "teams.db"

scoring:
  # Points added to the killer's team score (and the killer's personal score)
  # when they kill a player who is on a DIFFERENT team.
  kill-enemy-team-score: 10.0

  # Points SUBTRACTED from the killer's team score when they kill a civilian
  # (a player who isn't in any team).
  kill-civilian-penalty: 5.0

  # Bounty currency awarded to the killer for each enemy-team kill.
  # Civilian kills award no bounty.
  bounty-per-kill: 50.0

  # If true, killing your own teammate never changes any score/bounty.
  ignore-friendly-fire-scoring: true

  # Anti-farm: if the SAME killer kills the SAME victim again within this many
  # seconds, no team score / personal score / bounty is awarded for that repeat
  # kill. The kill/death still happens normally - only the reward is withheld.
  # Set to 0 to disable.
  same-victim-cooldown-seconds: 300

  # Within that cooldown window: the FIRST kill pays full reward,
  # the SECOND pays this fraction, and any further kills pay nothing.
  repeat-kill-reduced-multiplier: 0.5

  # Fraction of bounty-per-kill paid to whoever else damaged the victim in the last
  # 30 seconds but didn't land the final blow (an "assist"). Set to 0 to disable.
  assist-bounty-share: 0.25

  # Flat bounty bonus for defeating your "revenge target" - whoever killed you last.
  revenge-bonus-bounty: 100.0

  # When you kill a player who is carrying bounty, you claim this fraction of their
  # bounty as a bonus on top of the normal per-kill bounty.
  bounty-claim-percent: 0.5

  # Applies on EVERY death regardless of cause:
  # the victim's team loses this many points, and the victim personally loses
  # this much bounty (floored at 0). Set either to 0 to disable.
  death-team-score-penalty: 5.0
  death-bounty-penalty: 20.0

# Bounty hunter contracts: /bounty hunt <player> to take a contract on a specific
# player. Land the kill before the contract expires for a bonus.
bounty-hunter:
  contract-duration-seconds: 600
  bonus-bounty: 200.0

# Occasionally gives a random online player a hidden objective to eliminate a
# specific other online player (who must have bounty > 0). Only they see it.
secret-missions:
  enabled: true
  # How often (seconds) the plugin rolls to see if it should hand out a new mission.
  interval-seconds: 900
  # Chance (0.0-1.0) a mission is actually handed out each time the timer fires.
  chance: 0.5
  # How long (seconds) a player has to complete their mission before it expires.
  # Maximum is 86400 (1 day).
  duration-seconds: 86400
  bonus-bounty: 150.0

team:
  min-name-length: 3
  max-name-length: 16
  # Color used for a brand new team's prefix until the owner changes it.
  default-prefix-color: "WHITE"

chat:
  # {prefix} = the colored team prefix (blank for civilians), {player} = player name, {message} = chat message
  format: "{prefix}&r{player}&f: {message}"
  civilian-prefix: "&7[Civilian]&r "

tab:
  # Whether team prefixes should also show above players' heads / in the tab list.
  apply-to-tablist: true

leaderboard:
  top-teams-shown: 10
  top-bounty-shown: 10

# Combat-log protection. Only applies to players who are in a team.
# While tagged, logging out counts as a death.
combat-log:
  enabled: true
  tag-duration-seconds: 15

# Top-role assignments via Vault (LuckPerms, etc.).
# Set the Minecraft permission-group name that should be given to the #1
# bounty hunter and the #1 team player. Leave blank ("") to disable.
# Roles are refreshed automatically after every kill.
top-roles:
  top-bounty-hunter-group: ""
  top-team-player-group: ""
