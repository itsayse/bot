api:
  # Must point at the Discord bot's key API (utils/mc_api.py). Same machine -> localhost works.
  base-url: "http://127.0.0.1:8787"
  # Must exactly match MC_API_SECRET in the bot's .env
  secret: "change-this-to-match-your-bot-env"

auth:
  # How often (in minutes) online, already-authenticated (or already-frozen)
  # players get re-checked against the bot in case their key expired/was
  # revoked, or in case a frozen player's key has since been fixed.
  key-check-interval-minutes: 5
  # As soon as a key is found expired or revoked (or fails its re-check on
  # join), the player is frozen in place (can't move/break/place/interact/
  # damage/chat/run most commands) until they run /renewkey <newCode> or
  # /key <newCode> <discordId> with a valid key. This is how many minutes
  # they can stay frozen before being kicked as a last resort if they never
  # fix it. Applies to both expired and revoked keys.
  locked-timeout-minutes: 10

messages:
  need-key: "&eWelcome! Enter your access key and your Discord user ID: &7/key <code> <discordUserId>"
  rechecking-key: "&7Verifying your access key..."
  key-success: "&aKey accepted — you're in!"
  not-now: "&cThat command isn't usable right now."
  still-locked: "&cYou need a valid access key before doing that."
  key-invalid: "&cThat key is invalid."
  key-expired: "&cThat key has expired. Ask staff for a new one."
  key-revoked: "&cThat key has been revoked."
  key-used: "&cThat key has already been claimed by another account."
  key-check-failed-expired: "&cYou were kicked: your access key expired and was never renewed."
  key-check-failed-revoked: "&cYou were kicked: your access key was revoked and was never renewed."
  api-unreachable: "&cCouldn't reach the verification server — try again in a moment."
  discord-id-invalid: "&cThat doesn't look like a valid Discord user ID (15-20 digits). Enable Developer Mode in Discord, right-click your profile, then Copy User ID."
  changeuser-success: "&aYour linked Discord account was updated — your server role has been moved over."
  changeuser-failed: "&cCouldn't update your linked Discord account. Try again in a moment."
  key-locked-expired: "&cYour access key has expired! You're frozen and can't do anything — run &7/renewkey <newCode>&c with a fresh key to keep playing."
  key-locked-revoked: "&cYour access key was revoked! You're frozen and can't do anything — run &7/renewkey <newCode>&c with a valid key to keep playing."
  key-locked-reminder: "&cYou're still frozen — run &7/renewkey <newCode>&c or you'll be kicked soon."
  key-locked-action-blocked: "&cYou're frozen because your key is invalid. Run &7/renewkey <newCode>&c to keep playing."
  renewkey-success: "&aNew key accepted — you're unfrozen and all set, carry on!"
