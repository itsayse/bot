name: KeyAuth
version: '1.0.0'
main: dev.observer.keyauth.KeyAuthPlugin
api-version: '26.1'
author: YourName
description: Key-gated access for Minecraft — verifies keys against the Discord bot's key API. One key per player, kicks/freezes on expiry/revocation. Login itself is handled by a separate plugin.

commands:
  key:
    description: Redeem your access key and link your Discord account
    usage: /key <code> <discordUserId>
  changeuser:
    description: Re-link your account to a different Discord user id
    usage: /changeuser <newDiscordUserId>
  renewkey:
    description: Swap in a new access key (e.g. after yours expired) without losing your session
    usage: /renewkey <newCode>
