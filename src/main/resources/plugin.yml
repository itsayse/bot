name: PerfectTeams
version: '1.0.0'
main: com.perfectone.teams.TeamsPlugin
api-version: '1.20'
author: PerfectOne
description: Team creation, PvP scoring, bounty and rank system.
softdepend: [PlaceholderAPI, Vault]

commands:
  team:
    description: Manage your team
    usage: /team <create|join|leave|disband|color|info|stats|list|setmode|invite|uninvite|kick|ally|unally|allies|war|enemy|enemies|transfer> [args]
    aliases: [t]
  leaderboard:
    description: View the top teams by score and top players by bounty
    usage: /leaderboard
    aliases: [lb, teamtop]
  bounty:
    description: View the top 10 players by bounty, or take a contract with /bounty hunt <player>
    usage: /bounty [hunt <player>]
    aliases: [bountytop]
  afk:
    description: Toggle AFK status
    usage: /afk

permissions:
  teams.command.team:
    description: Allows use of /team
    default: true
  teams.command.leaderboard:
    description: Allows use of /leaderboard
    default: true
  teams.command.bounty:
    description: Allows use of /bounty
    default: true
  teams.command.afk:
    description: Allows use of /afk
    default: true
  teams.admin:
    description: Bypasses team ownership checks (disband/color/rename any team)
    default: op
