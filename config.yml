# PerfectTeams configuration

storage:
  # File name is stored inside the plugin's data folder (plugins/PerfectTeams/).
  # Point the Discord bot's MC_DB_PATH env var at this same file (see the discord-bot-addon README).
  database-file: "teams.db"

scoring:
  # Points added to the killer's team score (and the killer's personal score)
  # when they kill a player who is on a DIFFERENT team.
  kill-enemy-team-score: 10.0

  # Points SUBTRACTED from the killer's team score when they kill a civilian
  # (a player who isn't in any team).
  kill-civilian-penalty: 5.0

  # Bounty currency awarded to the killer for each enemy-team kill.
  # Civilian kills award no bounty.
  bounty-per-kill: 50.0

  # If true, killing your own teammate never changes any score/bounty.
  ignore-friendly-fire-scoring: true

  # Anti-farm: if the SAME killer kills the SAME victim again within this many
  # seconds, no team score / personal score / bounty is awarded for that repeat
  # kill (stops two players AFK-farming each other, or one player camping a
  # respawn point, for endless bounty). The kill/death still happens normally -
  # only the reward is withheld. Set to 0 to disable.
  same-victim-cooldown-seconds: 300

  # Applies on EVERY death, regardless of cause (PvP, mobs, fall damage, etc):
  # the victim's team loses this many points, and the victim personally loses
  # this much bounty (floored at 0). This is on top of the personal score
  # already resetting to zero on death. Set either to 0 to disable it.
  death-team-score-penalty: 5.0
  death-bounty-penalty: 20.0

team:
  min-name-length: 3
  max-name-length: 16
  # Color used for a brand new team's prefix until the owner changes it.
  default-prefix-color: "WHITE"

chat:
  # {prefix} = the colored team prefix (blank for civilians), {player} = player name, {message} = chat message
  format: "{prefix}&r{player}&f: {message}"
  civilian-prefix: "&7[Civilian]&r "

tab:
  # Whether team prefixes should also show above players' heads / in the tab list.
  apply-to-tablist: true

leaderboard:
  top-teams-shown: 10
  top-bounty-shown: 10

# Combat-log protection. Only applies to players who are in a team - civilians can
# disconnect mid-fight with no consequence. While tagged, logging out counts as a
# death: the normal death penalties apply, and if the last opponent is still online
# and on an enemy (non-allied) team, they get credited with the kill exactly as if
# they'd landed the final blow.
combat-log:
  enabled: true
  # How long (seconds) a team member stays "tagged" after taking or dealing PvP
  # damage. Logging out while tagged triggers the combat-log penalty.
  tag-duration-seconds: 15

# Pushes a snapshot of teams/players to your Discord bot's HTTP API so the
# /leaderboard and /bounty SLASH commands can show live data on Discord too.
# This talks to the SAME small aiohttp API your bot already runs for the key
# system (utils/mc_api.py) - point it at the same host/port/secret you used there.
discord-bridge:
  enabled: false
  # Base URL of the bot's API, e.g. "http://127.0.0.1:8787"
  api-base-url: "http://127.0.0.1:8787"
  # Must match MC_API_SECRET in the bot's .env
  api-secret: "change-this-to-a-long-random-string"
  # How often (seconds) to push a full snapshot as a heartbeat, in addition to
  # the immediate push that happens right after every kill/team-score change.
  sync-interval-seconds: 300
